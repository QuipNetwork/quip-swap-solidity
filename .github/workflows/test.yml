name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # The deployment artifact is compiled under a different profile (metadata
      # stripped, separate out dir), so a prod-only compile or size regression is
      # invisible to the build above. Catch it in PRs rather than at broadcast.
      - name: Run Forge build (prod deployment profile)
        run: FOUNDRY_PROFILE=prod forge build --sizes

      # The CreateX fork tests self-skip without API_URL_BASE_SEPOLIA, which CI
      # does not have. They still compile and typecheck here; the guard is
      # actually exercised by `make test-fork` before any broadcast.
      - name: Run Forge tests
        run: forge test -vvv
