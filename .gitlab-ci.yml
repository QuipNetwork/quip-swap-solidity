include:
  - project: quip.network/ci-templates
    ref: v1.2.0
    file: templates/dependency-gate.yml

stages:
  - test
  - publish

# Run on MRs and on pushes to main; skip branch pipelines for branches that
# already have an open MR so each push triggers one pipeline, not two.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  # Instance runners are on for publish:npm only. These tags keep every other job on the
  # group runners.
  tags: [linux, docker]

variables:
  FOUNDRY_VERSION: v1.8.1
  # sha256 of foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz from the GitHub release.
  FOUNDRY_SHA256: 37b45855232e57624d90113b049ca54f0c92055bb5c1997fcbdc3076c7b89c10
  BUN_VERSION: 1.3.5

.soldeer-cache: &soldeer-cache
  key:
    files:
      - soldeer.lock
  paths:
    - dependencies/

.sdk-cache: &sdk-cache
  key:
    files:
      - sdk/bun.lock
  paths:
    - sdk/node_modules/

.soldeer-install:
  script:
    # hashsigs-solidity is pinned by SSH URL in foundry.toml; the job has no SSH
    # key, but the repo is public, so fetch it over HTTPS instead.
    - git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
    - forge soldeer install

forge-test:
  stage: test
  image:
    name: ghcr.io/foundry-rs/foundry:$FOUNDRY_VERSION
    # The image's default entrypoint is `sh -c`, which swallows the job script.
    entrypoint: [""]
    # The image runs as `foundry`, which cannot write `dependencies/`, `cache/`
    # or `out/` into the runner-owned checkout.
    docker:
      user: root
  cache:
    - *soldeer-cache
  script:
    - !reference [.soldeer-install, script]
    - forge test

sdk-test:
  stage: test
  # vitest must run on Node: under the Bun runtime it runs 1 of 14 test files
  # and still exits 0.
  image: node:22-bookworm-slim
  cache:
    - *sdk-cache
  before_script:
    - npm install -g bun@$BUN_VERSION
  script:
    - cd sdk
    - bun install --frozen-lockfile
    - bun run test
    # Pack the release tarball. A stable tag vX.Y.Z must match package.json. Every other
    # pipeline gets a -ci suffix, a version that npm has not published, for release-check:npm.
    - |
      VERSION=$(node -p 'require("./package.json").version')
      if [[ "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        test "v$VERSION" = "$CI_COMMIT_TAG"
      else
        npm version "$VERSION-ci.$CI_PIPELINE_IID" --no-git-tag-version --ignore-scripts
      fi
    - bun run build
    - mkdir -p ../pkg
    - npm pack --pack-destination ../pkg
  artifacts:
    paths: [pkg/]
    expire_in: 1 week

# Integration and cross-chain suites deploy real Foundry artifacts to local
# Anvil nodes, so they need forge + anvil alongside Node and bun.
sdk-integration-test:
  stage: test
  image: node:22-bookworm
  cache:
    - *soldeer-cache
    - *sdk-cache
  before_script:
    - npm install -g bun@$BUN_VERSION
    - curl -sSfLO "https://github.com/foundry-rs/foundry/releases/download/$FOUNDRY_VERSION/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
    - echo "$FOUNDRY_SHA256  foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
    - tar xzf "foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin forge anvil
    - rm "foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
  script:
    - !reference [.soldeer-install, script]
    - cd sdk
    - bun install --frozen-lockfile
    - bun run test:integration
    - bun run test:cross-chain

# ── publish ───────────────────────────────────────────────────────
# A stable tag vX.Y.Z publishes @quip.network/quip-swap-sdk to npm through trusted
# publishing (OIDC). npm accepts the OIDC token only from a GitLab.com hosted runner, so
# sdk-test builds the tarball on the group runners and publish:npm only uploads it.
# Trusted publishing needs npm 11.5.1 and Node 22.14 or later, so both jobs use Node 24.

.npm-upload:
  stage: publish
  image: node:24-bookworm
  cache: []
  variables:
    GIT_STRATEGY: none

publish:npm:
  extends: .npm-upload
  tags: [saas-linux-small-amd64]
  interruptible: false
  environment: npm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    # SIGSTORE_ID_TOKEN lets npm sign the provenance statement.
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    # ./ makes npm read a file path. Without it, pkg/x.tgz parses as GitHub shorthand.
    - npm publish ./pkg/*.tgz --access public

# Runs the publish:npm command as a dry run, so a fault in the release path fails the MR
# instead of the tag. npm requires --tag for the -ci prerelease.
release-check:npm:
  extends: .npm-upload
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - npm publish ./pkg/*.tgz --access public --tag ci --dry-run
