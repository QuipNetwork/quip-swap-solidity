[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = 'long'
quote_style = 'single'
number_underscore = 'thousands'
multiline_func_header = 'params_first_multi'
sort_imports = true

[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
solc_version = '0.8.33'
evm_version = 'prague'
optimizer_runs = 10_000
ignored_warnings_from = ["dependencies/"]
# The SHRINCS integration tests run hashsigs' test-side signing helpers (keygen +
# stateful signing) in-EVM; they need far more gas/memory than the defaults, same
# as hashsigs-solidity's own foundry.toml. On-chain contracts are unaffected.
gas_limit = "18446744073709551615" # u64::MAX
memory_limit = 268_435_456
# Allow VerifyOmnibus.s.sol to read the SDK's canonical address file (default) and
# any repo-relative ADDRESS_JSON override (read-only verify script).
fs_permissions = [{access = "read", path = "./"}]
# hashsigs-solidity compiles itself with via_ir (UXMSS.sol is stack-too-deep
# without it). Restricting its implementation sources pins every compilation
# unit that includes them (the SHRINCS integration suite) to the via-ir
# profile; src/ only imports the dependency's interfaces and stays on the
# default pipeline, so production artifacts are unchanged.
additional_compiler_profiles = [{name = "via-ir", via_ir = true}]
compilation_restrictions = [
  {paths = "dependencies/@quip.network-hashsigs-solidity-0.2.0/contracts/UXMSS.sol", via_ir = true},
]

[lint]
# Disable naming convention warnings (test functions use snake_case, constants use SCREAMING_SNAKE_CASE)
exclude_lints = ["mixed-case-function", "mixed-case-variable"]

[profile.optimized]
via_ir = true
out = 'out-via-ir'

[rpc_endpoints]
base_sepolia = "${API_URL_BASE_SEPOLIA}"
op_sepolia = "${API_URL_OP_SEPOLIA}"

# No explicit `url`: forge then uses the Etherscan API V2 multichain endpoint
# (the old per-chain V1 URLs are deprecated and return NOTOK).
[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
op_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155420 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
