[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = 'long'
quote_style = 'single'
number_underscore = 'thousands'
multiline_func_header = 'params_first_multi'
sort_imports = true

[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
solc_version = '0.8.33'
evm_version = 'prague'
optimizer_runs = 10_000
ignored_warnings_from = ["dependencies/"]
# Allow VerifyOmnibus.s.sol to read the SDK's canonical address file (default) and
# any repo-relative ADDRESS_JSON override (read-only verify script).
fs_permissions = [{access = "read", path = "./"}]

[lint]
# Disable naming convention warnings (test functions use snake_case, constants use SCREAMING_SNAKE_CASE)
exclude_lints = ["mixed-case-function", "mixed-case-variable"]

[profile.optimized]
via_ir = true
out = 'out-via-ir'

[dependencies]
forge-std = "1.14.0"
solady = "0.1.26"
"@openzeppelin-contracts" = "5.6.0-rc.1"
"@quip.network/hashsigs-solidity" = { version = "0.1.0", git = "https://gitlab.com/piqued/hashsigs-solidity.git", branch = "main" }
pcaversaccio-createx = { version = "1.0.0", git = "https://github.com/pcaversaccio/createx.git", tag = "v1.0.0" }

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
