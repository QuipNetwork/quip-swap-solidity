[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = 'long'
quote_style = 'single'
number_underscore = 'thousands'
multiline_func_header = 'params_first_multi'
sort_imports = true
ignored_warnings_from = ["dependencies/"]

[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
solc_version = '0.8.33'
evm_version = 'prague'
optimizer_runs = 10_000

[profile.optimized]
via_ir = true
out = 'out-via-ir'

[dependencies]
forge-std = "1.14.0"
solady = "0.1.26"
"@openzeppelin-contracts" = "5.6.0-rc.1"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
